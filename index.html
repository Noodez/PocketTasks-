function awardSkillXP(p,k,amount){p.skillXP=p.skillXP||{};p.skillLevels=p.skillLevels||{};p.skillLevels[k]=p.skillLevels[k]||1;if(p.skillLevels[k]>=skillCap())return 0;p.skillXP[k]=(p.skillXP[k]||0)+Math.max(0,Math.round(amount));let gained=0;while(p.skillLevels[k]<skillCap()&&p.skillXP[k]>=skillNeed(p.skillLevels[k])){p.skillXP[k]-=skillNeed(p.skillLevels[k]);p.skillLevels[k]++;gained++}return gained}

// Shared terrain generator and skill rules for races, marathons and endless training.
const COURSE_TYPES=['speed','swim','climb'];
function makeCourseSection(type,previous=''){
 const key=type||COURSE_TYPES[Math.floor(Math.random()*3)];
 const names=biomes[key].filter(n=>n!==previous);
 const name=names[Math.floor(Math.random()*names.length)]||biomes[key][0];
 const length=8+Math.random()*22;
 const icons=key==='swim'?['🪷','🐟','🫧','🌊','🪨']:key==='climb'?['🪨','🌿','🍂','🌲','🪵']:['🌼','🌳','🍄','🌿','🪨'];

}
function makeCourse(count,previous=''){
 const types=count===Infinity?[]:Array.from({length:count},(_,i)=>COURSE_TYPES[i%3]);
 let prior=previous;
 return types.map(type=>{let section=makeCourseSection(type,prior);prior=section.name;return section});
}
function courseSkill(type){return type==='speed'?'speed':type==='swim'?'swim':'climb'}
function awardCourseXP(p,section,amount,extra=0){
 let result={};result[courseSkill(section.type)]=amount;
 result.endure=Math.round(extra*.5);result.recover=Math.round(extra*.5);
 for(let [k,v] of Object.entries(result))if(v>0)awardSkillXP(p,k,v);
 return result;
}
function courseSpeed(stats,section,sprinting,bonus=1){
 const index=COURSE_TYPES.indexOf(section.type);
 return (.038+stats[index]*.0023)*(sprinting?1.5:1)*bonus;
}

function trainStat(k){

 trainingGame.nextSection.length=Math.min(85,5+(trainingGame.segments+1)*2.3+Math.random()*5);
 showAutoTraining(true);
 clearInterval(autoTrainingTimer);
 autoTrainingTimer=setInterval(()=>{
 const g=trainingGame;if(!g?.running){clearInterval(autoTrainingTimer);return}
 const pet=s.pets[g.pet];g.frame=(g.frame||0)+1;if(g.speedMultiplier===1&&g.frame%2===0)return;g.phase++;
 g.elapsedMs+=420;
 const boost=g.elapsedMs<g.boostUntil?(g.boostPower||1):1;

 if(g.terrain!=='speed'){
   if(!g.obstacle&&g.elapsedMs>=g.nextObstacle)g.obstacle={x:15+Math.random()*70,born:g.elapsedMs};
   if(g.obstacle&&g.elapsedMs-g.obstacle.born>=2100){
     const avoided=g.terrain==='swim'?Math.abs(g.lane-g.obstacle.x)>18:g.elapsedMs<=g.jumpUntil;
     if(avoided){g.successes++;g.lastObstacle='Nice dodge!';awardSkillXP(pet,g.terrain,2)}
     else{let damage=1+Math.floor(Math.random()*5);pet.energy=Math.max(0,pet.energy-damage);g.obstacles++;g.lastObstacle='Obstacle! −'+damage+' energy'}
     g.obstacle=null;g.nextObstacle=g.elapsedMs+900+Math.random()*1300;
   }
 }

 if(g.distance>=g.sectionLength){
  g.segments++;let gain=5+Math.floor(Math.random()*5);

  s.globalXP+=Math.round(gain*.35);pet.xp+=Math.round(gain*.35);
  const overflow=g.distance-g.sectionLength;
  g.currentSection=g.nextSection;g.obstacle=null;g.nextObstacle=g.elapsedMs+1200;
  g.biome=g.currentSection.name;g.terrain=g.currentSection.type;
  g.sectionLength=g.currentSection.length;g.decorations=g.currentSection.decorations;g.distance=Math.min(overflow,g.sectionLength);

function submit(e){if(e.target.id==='profile-form'){e.preventDefault();let fd=new FormData(e.target);s.profile.name=String(fd.get('name')||'Trainer').trim().slice(0,40)||'Trainer';s.profile.gender=['F','M'].includes(fd.get('gender'))?fd.get('gender'):'';s.profile.avatar=String(fd.get('avatar')||'🌟');s.profile.bio=String(fd.get('bio')||'').trim().slice(0,300);save();render();toast('Profile saved');return}if(e.target.id==='task-form'){e.preventDefault();let form=e.target,fd=new FormData(form),title=String(fd.get('title')||'').trim();if(!title)return;let type=String(fd.get('type')),mode=type!=='once'&&fd.get('mode')==='count'?'count':'check';let old=modal.edit?s.tasks.find(t=>t.id===modal.task.id):null;let subs=[...form.querySelectorAll('.subval')].map(x=>x.value.trim()).filter(Boolean);let weekdays=fd.getAll('weekdays').map(Number),schedule=type==='daily'?fd.get('habitSchedule'):type==='repeat'?fd.get('ritualSchedule'):'';if(type==='daily'&&schedule==='weekdays'&&!weekdays.length){toast('Choose at least one weekday');return}let t={...(old||{}),schedule,weekdays,unit:schedule==='weeks'?'weeks':'days',monthWeek:Number(fd.get('monthWeek')),monthDay:Number(fd.get('monthDay')),dueDate:String(fd.get('dueDate')||''),id:old?.id||id(),created:old?.created||Date.now(),title,type,mode,color:String(fd.get('color')),notes:String(fd.get('notes')||'').trim(),every:Math.max(1,Math.min(365,Number(fd.get('every'))||7))*(schedule==='weeks'?7:1),start:String(fd.get('start')||localDate()),subs,done:old?.done||{},counts:old?.counts||{},subdone:old?.subdone||{}};if(old){if(old.type!==t.type||old.mode!==t.mode||old.every!==t.every||old.start!==t.start||old.schedule!==t.schedule||JSON.stringify(old.weekdays)!==JSON.stringify(t.weekdays)||old.monthWeek!==t.monthWeek||old.monthDay!==t.monthDay){t.done={};t.counts={};t.subdone={}}else if(JSON.stringify(old.subs)!==JSON.stringify(subs)){t.subdone={}}s.tasks=s.tasks.map(x=>x.id===old.id?t:x)}else {s.tasks.unshift(t);let tutorial=s.tasks.find(x=>x.tutorial===type);if(tutorial&&!isDone(tutorial))toggleTask(tutorial,true)}modal=null;save();render();toast(old?'Task updated':'Task created');return}if(e.target.id==='rename-form'){e.preventDefault();let name=String(new FormData(e.target).get('name')||'').trim();if(name){s.pets[modal.index].name=name;save();modal=null;render()}return}}
// Always issue stable IDs for quest claims, including restored saves.
function ensureQuestIds(){for(let q of [...s.quests.daily,...s.quests.bonus])if(!q.id)q.id=id()}
const originalMaintenance=maintenance;maintenance=function(){originalMaintenance();ensureQuestIds();save()};
document.body.insertAdjacentHTML('beforeend','<div id="race-overlay"></div>');document.addEventListener('pointerdown',e=>{if(e.target.id==='fitting-accessory'&&fittingOpen){dragging=true;e.target.setPointerCapture(e.pointerId)}});document.addEventListener('pointermove',e=>{if(!dragging)return;let scene=document.querySelector('.shop-pet-scene');if(!scene)return;let r=scene.getBoundingClientRect(),p=s.pets[s.active],name=tryOn||p.equipped;if(!name)return;p.positions=p.positions||{};let pos=tryPosition;pos.x=Math.round(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)));pos.y=Math.round(Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)));let node=document.getElementById('fitting-accessory');if(node){node.style.left=pos.x+'%';node.style.top=pos.y+'%'}for(let key of ['x','y']){let inp=document.querySelector(`[data-fit="${key}"]`);if(inp)inp.value=pos[key]}});document.addEventListener('pointerup',()=>{if(dragging){dragging=false}});document.addEventListener('toggle',e=>{if(e.target.matches('details.skill-details')){try{localStorage.setItem('ps_skill_details_open',e.target.open?'1':'0')}catch(_){}}},true);document.addEventListener('click',click);document.addEventListener('change',change);document.addEventListener('submit',submit);document.addEventListener('input',e=>{if(e.target.dataset.fit){fitChange(e.target);return}if(e.target.dataset.setting){s.settings[e.target.dataset.setting]=e.target.value;save();cssVars()}});window.addEventListener('focus',()=>{maintenance();render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();updateClocks();setInterval(updateClocks,1000);
})();
</script></body></html>
